[package]
name = "pek-rcode"
version = "0.1.0"
edition = "2024"
description = "Pek.RCode：DH.NCode(XCode ORM) 的 Rust 实现——Model.xml 数据建模、多数据库方言、对象实体增删改查与代码生成，服务 C# 项目向 Rust 的渐进迁移"
authors = ["PeiKeSmart"]
license = "MIT"

[dependencies]
chrono = "0.4.45"
# DH 基础库（DH.RustBase）：时间文本格式/解析、MD5 摘要、文本文件读写等基础方法
dhrust = { path = "../DH.RustBase" }
# PostgreSQL 参数绑定直接依赖 postgres-types（与 postgres 主驱动共用同一版本；随 driver-postgresql 启用）
bytes = { version = "1", optional = true }
# MySQL：TLS 后端由特性选择（默认 tls-native；`--no-default-features --features tls-rustls` 支持 PEM 客户端证书）
mysql = { version = "28.0.2", default-features = false, features = ["minimal", "derive", "buffer-pool"], optional = true }
# TLS 后端之一：native-tls（Windows 下走 schannel；客户端标识仅 PKCS#12）
native-tls = { version = "0.2.18", optional = true }
oracle = { version = "0.6.3", features = ["chrono"], optional = true }
postgres = { version = "0.19.14", features = ["with-chrono-0_4"], optional = true }
# PostgreSQL：TLS 经 native-tls（postgres-native-tls 适配；由 tls-native 特性携带启用）
postgres-native-tls = { version = "0.5", optional = true }
# TLS 后端之二：rustls（PEM 根证书/客户端证书；PG 走 tokio-postgres-rustls，MySQL 启用 mysql/rustls）
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2.2", optional = true }
postgres-rustls = { version = "0.14", package = "tokio-postgres-rustls", optional = true }
webpki-roots = { version = "1", optional = true }
postgres-types = { version = "0.2", optional = true }
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Decimal 精确值（对 PostgreSQL 的绑定转换随 driver-postgresql 特性启用）
rust_decimal = { version = "1.43.0" }
thiserror = "2.0.21"
# SQL Server：tiberius 默认特性含 native-tls（+winauth），会拖入 openssl-sys 阻断 musl 交叉；
# 关默认、保留 TDS8/数值特性，TLS 后端由 tls-native/tls-rustls 弱依赖转发
tiberius = { version = "0.13.0", default-features = false, features = ["tds80", "chrono", "rust_decimal"], optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tokio-util = { version = "0.7.19", features = ["compat"], optional = true }
odbc-api = { version = "29.1.0", optional = true }
duckdb = { version = "1.10505.0", features = ["bundled", "chrono", "rust_decimal"], optional = true }
# Firebird：facade 高层 API + 原生客户端（运行时动态加载 fbclient.dll，无需构建期 SDK）
rsfbclient = { version = "0.28.0", default-features = false, features = ["native_client", "dynamic_loading"], optional = true }
# 显式依赖底层连接类型（facade 未重导出 NativeFbClient）
rsfbclient-native = { version = "0.28.0", features = ["dynamic_loading"], optional = true }
hdbconnect = { version = "0.32.0", optional = true }
mongodb = { version = "3.9.1", optional = true }
# 数据备份：GZip 压缩（`.gz`）与多表 zip 包（与 C# DbPackage 文件格式互通）
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 数据库约定文件（Database.toml）反序列化（随 driver-pack 启用）
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
# HTTP 类驱动（ClickHouse/TDengine/InfluxDB）与 network/db_service 共用传输层
# 默认不含 TLS：https 场景由可选特性 `http-tls` 启用（ureq/rustls）；局域网明文 HTTP 无需 TLS，
# 纯 SQLite 消费方可因此少编 rustls+ring（构建更小更快）
ureq = { version = "3.4.2", default-features = false, features = ["gzip"] }
futures-util = { version = "0.3.34", optional = true }
# Redis 集成：使用 Pek.RRedis（DH.NRedis 的 Rust 实现，与 C# 端字节级互通）
pek-rredis = { path = "../Pek.RRedis", optional = true }

[profile.release]
lto = "thin"
strip = true

[features]
# 默认 = native-tls + 全部数据库驱动 + HTTP 传输层 TLS（与既往版本行为完全一致；轻量消费方可按 driver-* 裁剪）
default = ["tls-native", "all-drivers", "http-tls"]
duckdb = ["dep:duckdb"]
# ———— 数据库驱动（按需裁剪：如仅用 SQLite+MySQL 的消费方）————
# 全部驱动（默认组合）：关闭 default 后可按需只选 driver-* 子集
all-drivers = [
    "driver-mysql",
    "driver-sqlserver",
    "driver-postgresql",
    "driver-oracle",
    "driver-firebird",
    "driver-clickhouse",
    "driver-tdengine",
    "driver-influxdb",
    "driver-hana",
    "driver-mongodb",
    "driver-odbc",
]
# MySQL / MariaDB / NovaDb（纯 Rust 驱动）
driver-mysql = ["dep:mysql"]
# SQL Server（tiberius，纯 Rust TDS）
driver-sqlserver = ["dep:tiberius", "dep:tokio-util"]
# PostgreSQL 系（含 HighGo/KingBase/VastBase；Decimal 绑定转换一并启用）
# native-tls 适配（postgres-native-tls）不在此声明：由 tls-native 特性携带，
# 使 driver-postgresql + tls-rustls 组合（musl 交叉打包）不引入 openssl-sys
driver-postgresql = [
    "dep:postgres",
    "dep:postgres-types",
    "dep:bytes",
    "rust_decimal/db-tokio-postgres",
]
# Oracle（oracle crate / OCI，运行时需 Instant Client）
driver-oracle = ["dep:oracle"]
# Firebird（rsfbclient 动态加载 fbclient.dll）
driver-firebird = ["dep:rsfbclient", "dep:rsfbclient-native"]
# ClickHouse / TDengine / InfluxDB（HTTP 接口，无额外依赖）
driver-clickhouse = []
driver-tdengine = []
driver-influxdb = []
# SAP HANA（hdbconnect）
driver-hana = ["dep:hdbconnect"]
# MongoDB（SQL 子集翻译为文档操作）
driver-mongodb = ["dep:mongodb", "dep:futures-util"]
# ODBC 桥（DB2 / 达梦 / IRIS / Access）
driver-odbc = ["dep:odbc-api"]
# ODBC 内置 unixODBC 静态库（面向 linux-gnu 交叉构建）：musl 静态二进制的 dlopen 是桩函数
# （"Dynamic loading not supported"），而 ODBC 驱动管理器运行时必须 dlopen 厂商驱动，
# 故 odbc 只能构建为 glibc 目标（glibc 动态二进制 + 内置 unixODBC，除厂商驱动外无系统依赖）。
# 静态库由第三方构建脚本 unix-odbc 产出；odbc-sys 由本仓 [patch.crates-io] 修正主机/目标判断（见文件尾）。
# windows 目标不需要此特性（非静态链接直接走系统 odbc32）
odbc-vendored = ["odbc-api?/vendored-unix-odbc"]
# TLS 后端（两者互斥）：tls-native（缺省，native-tls；客户端证书仅 PKCS#12）
# 注：`mysql?/`、`tiberius?/` 为弱依赖语法——未启用对应驱动时不会把驱动带回；
#     PG 侧的 postgres-native-tls 适配随本特性启用（driver-postgresql 已不再声明，
#     否则 driver-postgresql + tls-rustls 组合在 musl 交叉时会拉入 openssl-sys）
tls-native = [
    "dep:native-tls",
    "dep:postgres-native-tls",
    "mysql?/native-tls",
    "tiberius?/native-tls",
]
# TLS 后端：rustls（支持 PEM 客户端证书；配合 --no-default-features 使用）
tls-rustls = [
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:postgres-rustls",
    "dep:webpki-roots",
    "mysql?/rustls",
    "tiberius?/rustls",
]
# HTTP 传输层 TLS（ureq/rustls）：ClickHouse/TDengine/InfluxDB 与 db_service 的 https 需要
http-tls = ["ureq/rustls"]
# 驱动包按需分发（DriverManager）：从 Pek.RPanlServer 组件源下载 dbserver 驱动包并按需拉起
# （Ed25519 验签经 dhrust/plugin；Database.toml 约定文件经 dhrust/toml；driver-pack 已含 http-tls
# ——https 组件源开箱可用；自签/内网 CA 源经 Database.toml 的 [DriverStore] CaFile 指定根证书）
# 数据库连接约定文件（Config/Database.toml）：解析 + 多数据源容器 + SQLite 相对路径解析
database = ["dhrust/toml", "dep:serde"]
# 驱动按需分发（组件/network）：在约定文件基础上增加 [DriverStore] 自动下载分发
driver-pack = ["database", "dhrust/plugin", "http-tls"]
# Redis 集成（Pek.RRedis）：分布式缓存版本号跨进程失效
redis = ["dep:pek-rredis"]

[workspace]
members = ["derive"]

# odbc-sys 0.31 的 build.rs 用 cfg!(target_os = "windows") 判断的是“主机”而非“目标”——
# Windows 主机交叉编译到 Linux 目标并启用 static 特性（odbc-vendored → vendored-unix-odbc）时会误 panic。
# 本地副本（third_party/odbc-sys）已将判断改为 CARGO_CFG_TARGET_OS（目标平台）。
# 仅在启用 odbc-vendored 的打包构建中生效；odbc-sys/odbc-api 升级后需对照上游 build.rs 重新同步该补丁。
[patch.crates-io]
odbc-sys = { path = "third_party/odbc-sys" }

[dev-dependencies]
# 派生宏（`#[derive(Entity)]`）：与主 crate 分离的 proc-macro 包
pek-rcode-derive = { path = "derive" }
# TLS 测试：生成自签 PEM 客户端证书（tls-rustls 用例）
rcgen = "0.13"
# TLS 测试：自签 https 静态服务（driver-pack https 用例）
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[[example]]
# 驱动包按需分发演示（下载 → 验签 → 拉起 → network 连接）
name = "driver_fetch"
required-features = ["driver-pack"]
