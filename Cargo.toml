[package]
name = "pek-rcode"
version = "0.1.0"
edition = "2024"
description = "Pek.RCode：DH.NCode(XCode ORM) 的 Rust 实现——Model.xml 数据建模、多数据库方言、对象实体增删改查与代码生成，服务 C# 项目向 Rust 的渐进迁移"
authors = ["PeiKeSmart"]
license = "MIT"

[dependencies]
chrono = "0.4.45"
# DH 基础库（DH.RustBase）：时间文本格式/解析、MD5 摘要、文本文件读写等基础方法
dhrust = { path = "../DH.RustBase" }
# PostgreSQL 参数绑定直接依赖 postgres-types（与 postgres 主驱动共用同一版本）
bytes = "1"
# MySQL：native-tls 后端（SslMode=Required/VerifyCA/VerifyFull 真实建立 TLS）
mysql = { version = "28.0.2", features = ["native-tls"] }
# PostgreSQL/MySQL 共用 TLS 后端（Windows 下走 schannel）
native-tls = "0.2.18"
oracle = { version = "0.6.3", features = ["chrono"] }
postgres = { version = "0.19.14", features = ["with-chrono-0_4"] }
# PostgreSQL：TLS 经 native-tls（postgres-native-tls 提供 MakeTlsConnect 适配）
postgres-native-tls = "0.5"
postgres-types = "0.2"
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_decimal = { version = "1.43.0", features = ["db-tokio-postgres"] }
thiserror = "2.0.21"
tiberius = { version = "0.13.0", features = ["chrono", "rust_decimal"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
odbc-api = "29.1.0"
duckdb = { version = "1.10505.0", features = ["bundled", "chrono", "rust_decimal"], optional = true }
# Firebird：facade 高层 API + 原生客户端（运行时动态加载 fbclient.dll，无需构建期 SDK）
rsfbclient = { version = "0.28.0", default-features = false, features = ["native_client", "dynamic_loading"] }
# 显式依赖底层连接类型（facade 未重导出 NativeFbClient）
rsfbclient-native = { version = "0.28.0", features = ["dynamic_loading"] }
hdbconnect = "0.32.0"
mongodb = "3.9.1"
serde_json = "1"
ureq = "3.4.2"
futures-util = "0.3.34"
# Redis 集成：使用 Pek.RRedis（DH.NRedis 的 Rust 实现，与 C# 端字节级互通）
pek-rredis = { path = "../Pek.RRedis", optional = true }

[profile.release]
lto = "thin"
strip = true

[features]
duckdb = ["dep:duckdb"]
# Redis 集成（Pek.RRedis）：分布式缓存版本号跨进程失效
redis = ["dep:pek-rredis"]

[workspace]
members = ["derive"]

[dev-dependencies]
# 派生宏（`#[derive(Entity)]`）：与主 crate 分离的 proc-macro 包
pek-rcode-derive = { path = "derive" }
